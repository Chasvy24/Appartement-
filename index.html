  --zebra:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27180%27 height=%2720%27 viewBox=%270 0 180 20%27%3E%3Crect width=%27180%27 height=%2720%27 fill=%27%23F7F4F0%27/%3E%3Cpath fill=%27%231C1512%27 d=%27M3.0 0H6.8Q5.0 10.0 7.6 20H4.5Q4.0 10.0 3.0 0ZM11.5 0H16.1Q13.1 10.0 13.5 20H10.9Q8.7 10.0 11.5 0ZM23.9 0H26.9Q30.2 10.0 28.5 20H25.1Q25.0 10.0 23.9 0ZM35.3 0H38.0Q34.8 10.0 39.1 20H33.2Q31.9 10.0 35.3 0ZM39.2 11.0L44.6 20H40.7ZM43.2 0H48.0Q47.6 10.0 47.0 20H41.9Q39.9 10.0 43.2 0ZM49.2 11.0L52.8 20H50.7ZM55.2 0H59.4Q59.6 10.0 59.8 20H56.1Q54.4 10.0 55.2 0ZM66.7 0H70.2Q72.6 10.0 71.8 20H67.0Q68.2 10.0 66.7 0ZM71.4 11.0L77.3 20H72.9ZM75.2 0H79.3Q77.5 10.0 77.2 20H71.7Q70.7 10.0 75.2 0ZM86.9 0H91.7Q91.9 10.0 91.0 20H85.0Q86.5 10.0 86.9 0ZM98.0 0H103.9Q104.7 10.0 104.0 20H97.8Q95.3 10.0 98.0 0ZM111.0 0H117.4Q115.7 10.0 114.6 20H108.8Q110.9 10.0 111.0 0ZM118.6 11.0L123.0 20H120.1ZM122.6 0H125.6Q124.7 10.0 128.0 20H125.3Q122.4 10.0 122.6 0ZM133.6 0H136.4Q138.9 10.0 138.4 20H134.1Q135.7 10.0 133.6 0ZM142.0 0H146.2Q150.8 10.0 149.8 20H145.8Q141.8 10.0 142.0 0ZM147.4 11.0L151.1 20H148.9ZM151.6 0H156.0Q151.9 10.0 154.1 20H149.2Q149.9 10.0 151.6 0ZM162.8 0H169.1Q169.9 10.0 168.2 20H163.0Q163.9 10.0 162.8 0ZM170.3 11.0L176.0 20H171.8Z%27/%3E%3C/svg%3E");
  --shadow:0 1px 2px rgba(42,30,23,.05),0 6px 20px rgba(42,30,23,.06);
  --backdrop:rgba(28,20,15,.5);
  --f-display:"Reem Kufi","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14110F; --surface:#1E1915; --surface-2:#27211C; --ink:#F2ECE6; --muted:#B5A8A2; --line:#3A312C; --line-strong:#4E423D;
  --brand:#8B5535; --on-brand:#FFFFFF; --brand-ink:#E6C9C3; --wine:#9E2F4F; --on-wine:#FFFFFF; --wine-soft:#3A1720; --wine-ink:#EDB2C2; --on-bad:#1B0E0C;
  --header:#2A1A11; --header-ink:#F7F1EC;
  --sand:#E9A1B5; --sand-soft:#3A1720;
  --good:#62C48F; --good-soft:#163024; --warn:#E9A1B5; --warn-soft:#3A1720; --bad:#FF7A6B; --bad-soft:#3E1A16;
  --chart-a:#A3562B; --on-chart:#FFFFFF; --chart-b:#D46F96; --grid:#2E2722;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14110F; --surface:#1E1915; --surface-2:#27211C; --ink:#F2ECE6; --muted:#B5A8A2; --line:#3A312C; --line-strong:#4E423D;
  --brand:#8B5535; --on-brand:#FFFFFF; --brand-ink:#E6C9C3; --wine:#9E2F4F; --on-wine:#FFFFFF; --wine-soft:#3A1720; --wine-ink:#EDB2C2; --on-bad:#1B0E0C;
  --header:#2A1A11; --header-ink:#F7F1EC;
  --sand:#E9A1B5; --sand-soft:#3A1720;
  --good:#62C48F; --good-soft:#163024; --warn:#E9A1B5; --warn-soft:#3A1720; --bad:#FF7A6B; --bad-soft:#3E1A16;
  --chart-a:#A3562B; --on-chart:#FFFFFF; --chart-b:#D46F96; --grid:#2E2722;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  --backdrop:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit}
a{color:var(--brand-ink)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tnum,.num,td,th{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- En-tête ---------- */
.top{position:relative;background-color:var(--header);color:var(--header-ink)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--zebra) repeat-x left center/auto 100%;border-top:1px solid rgba(255,255,255,.12)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 30px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:1.5rem;line-height:1.1;letter-spacing:.01em}
.brand p{margin:3px 0 0;font-size:.8rem;opacity:.86}
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--header-ink);border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#9be3b8}
.sync.warn .dot{background:#F2A7B9}.sync.bad .dot{background:#ff9d92}.sync.wait .dot{background:#d7e3ee}

/* ---------- Onglets ---------- */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:8px;padding:13px 14px 11px;border:0;background:none;color:var(--muted);font-weight:600;font-size:.92rem;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab svg{width:19px;height:19px}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--brand-ink);border-bottom-color:var(--brand)}
.tab .s{display:none}
main{padding-block:20px 48px}
@media (max-width:820px){
  .tabs{position:fixed;top:auto;bottom:0;left:0;right:0;border-bottom:0;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs-in{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
  .tab{flex-direction:column;gap:3px;padding:8px 0 7px;font-size:.64rem;letter-spacing:-.01em;border-bottom:0;border-top:2px solid transparent;justify-content:center;min-width:0}
  .tab .s{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tab[aria-current="page"]{border-top-color:var(--brand);background:var(--wine-soft)}
  .tab .l{display:none}.tab .s{display:block}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .brand h1{font-size:1.25rem}
  .brand p{font-size:.74rem}
  .top-in{padding-block:14px 26px}
}

/* ---------- Éléments communs ---------- */
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:16px}
.vhead h2{font-family:var(--f-display);font-weight:600;font-size:1.55rem;letter-spacing:.01em;margin-right:auto}
.vact{display:flex;flex-wrap:wrap;gap:8px}
.msw{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.msw .mlabel{min-width:9.5em;text-align:center;font-weight:700;font-size:.92rem}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:999px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 16px;border-radius:10px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--surface);color:var(--brand-ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--wine-soft);filter:none}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.small{min-height:34px;padding:5px 11px;font-size:.82rem;border-radius:8px}
.btn.tiny{min-height:30px;padding:3px 10px;font-size:.78rem;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--brand-ink);font-weight:700;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h3{font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .muted{font-weight:600}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:.83rem}
.xs{font-size:.75rem}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.cols,.cols-3{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.74rem;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:1.5}
.pill svg{width:13px;height:13px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--wine);color:var(--on-wine)}
.pill.sand{background:var(--sand-soft);color:var(--sand)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.pill.outline{background:transparent;border-color:var(--line-strong);color:var(--muted)}
button.pill{cursor:pointer}
.kind{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:1px 7px;border-radius:6px;white-space:nowrap;vertical-align:1px}
.kind.real{background:var(--good-soft);color:var(--good)}
.kind.est{background:var(--sand-soft);color:var(--sand)}
.kind.planned,.kind.calc{background:transparent;color:var(--brand-ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.kind.mixed{background:var(--surface-2);color:var(--muted)}
.tag-sample{display:inline-block;font-size:.66rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:5px;border:1px dashed var(--sand);color:var(--sand);vertical-align:2px;margin-left:4px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:12px;font-size:.9rem}

/* ---------- Bannières ---------- */
.banners{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;font-size:.88rem;border:1px solid}
.banner svg{flex:none;width:18px;height:18px;margin-top:2px}
.banner .b-txt{flex:1;min-width:0}
.banner.sand{background:var(--sand-soft);border-color:color-mix(in srgb,var(--sand) 30%,transparent);color:var(--ink)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.banner.blue{background:var(--wine-soft);border-color:color-mix(in srgb,var(--wine-ink) 25%,transparent)}
.banner .btn{margin-left:auto}

/* ---------- Tableau de bord ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;padding:30px 22px 22px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--zebra) repeat-x left center/auto 100%}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}}
.big{font-size:clamp(2rem,6vw,2.9rem);font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.chf{color:var(--muted);font-weight:600;font-size:.95rem;margin-top:4px}
.status{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700}
.status .ic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;flex:none}
.status .ic svg{width:15px;height:15px}
.status.good .ic{background:var(--good-soft);color:var(--good)}
.status.bad .ic{background:var(--bad-soft);color:var(--bad)}
.status.muted .ic{background:var(--surface-2);color:var(--muted)}
.meter{margin-top:12px}
.meter-track{position:relative;height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter-fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--brand)}
.meter-fill.ok{background:var(--good)}
.meter-legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:.84rem;color:var(--muted)}
.meter-legend b{color:var(--ink)}
.occ{border-left:1px solid var(--line);padding-left:20px;display:flex;flex-direction:column;justify-content:center;gap:6px}
@media (max-width:760px){.occ{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}}
.occ-bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;margin-top:4px}
.occ-bar span{height:14px;border-radius:3px;background:var(--surface-2)}
.occ-bar span.on{background:var(--chart-a)}
.occ-bar span.req{background:var(--sand-soft);outline:1px dashed var(--sand);outline-offset:-1px}
.occ-bar span.past{opacity:.78}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .lab{font-size:.78rem;font-weight:700;color:var(--muted)}
.kpi .val{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.76rem;color:var(--muted)}
.kpi .delta{font-size:.76rem;font-weight:700}
.kpi.main{background:var(--wine-soft);border-color:transparent}
.todo-group{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.todo-group:first-of-type{border-top:0;margin-top:0;padding-top:0}
.todo-group h4{font-size:.8rem;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.todo-item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:.88rem}
.todo-item .t{flex:1;min-width:0}
.todo-item .t small{display:block;color:var(--muted);font-size:.76rem}
.todo-item .amt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.up-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.up-item:first-child{border-top:0}
.datebox{flex:none;width:48px;text-align:center;border-radius:10px;background:var(--wine-soft);color:var(--wine-ink);padding:5px 0;line-height:1.1}
.datebox b{display:block;font-size:1.15rem;font-weight:800}
.datebox small{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.datebox.past{background:var(--surface-2);color:var(--muted)}
.datebox.req{background:var(--sand-soft);color:var(--sand)}

/* ---------- Listes ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters select,.filters input{min-height:38px;font-size:.88rem;padding:6px 10px;width:auto;max-width:100%}
.filters input[type="search"]{flex:1;min-width:160px}
.summary-line{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.summary-line b{color:var(--ink)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:transparent;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-title{font-weight:700}
.row-meta{font-size:.8rem;color:var(--muted)}
.row .pills{display:flex;flex-wrap:wrap;gap:5px}
.row-amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap}
.row-amt b{font-variant-numeric:tabular-nums}
.row-amt small{font-size:.72rem;color:var(--muted)}
.catdot{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.catdot svg{width:18px;height:18px}
.catdot.fixed{background:var(--wine-soft);color:var(--brand-ink)}
.bars{display:flex;flex-direction:column;gap:8px}
.barline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:.85rem}
.barline .track{grid-column:1/-1;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.barline .track i{display:block;height:100%;background:var(--chart-b);border-radius:999px}

/* ---------- Tableaux ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;font-weight:800;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;border-top:2px solid var(--line-strong)}
tr.grand td{font-weight:800;font-size:1rem;background:var(--wine-soft);border-bottom:0}
tr.sub td{color:var(--muted);font-size:.82rem}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--wine-soft)}
tr.future td{color:var(--muted)}
.calc td:first-child{min-width:220px}
.calc .note{display:block;font-size:.76rem;color:var(--muted);margin-top:2px;font-weight:500}
.calc tr.section td{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);border-bottom:0}

/* ---------- Graphique ---------- */
.chart-wrap{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line-strong);stroke-width:1}
.chart .ba{fill:var(--chart-a)}.chart .bb{fill:var(--chart-b)}
.chart .fut{opacity:.42}
.chart path,.chart text,.chart line{pointer-events:none}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.on{fill:var(--surface-2);opacity:.6}
.chart .selm{fill:var(--ink);font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:.8rem;min-width:170px}
.tip b{display:block;margin-bottom:3px}
.tip div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}

/* ---------- Calendrier ---------- */

function calcBooking(b) {

}

function deltaHTML(cur, prev, { goodUp = true, pts = false, prevYm } = {}) {

  const up = d > 0, good = up === goodUp;
  const txt = pts ? `${up ? "+" : "−"}${Math.round(Math.abs(d) * 100)} pts` : mad(d, { sign: true });
  return `<span class="delta ${good ? "pos" : "neg"}">${up ? "▲" : "▼"} ${txt} <span class="muted">vs ${monthName(prevYm)}</span></span>`;
}

function todoData() {
  const today = todayStr(), in7 = addDays(today, 7);
  const lateTasks = S.tasks.filter(t => t.status !== "terminee" && isDate(t.date) && t.date < today).sort((a, b) => a.date.localeCompare(b.date));
  const soonTasks = S.tasks.filter(t => t.status !== "terminee" && isDate(t.date) && t.date >= today && t.date <= in7).sort((a, b) => a.date.localeCompare(b.date));
  const payments = S.bookings.filter(b => (b.status === "confirmee" || b.status === "terminee") && b.payStatus !== "paye").map(b => ({ b, c: calcBooking(b) })).filter(x => x.c.due > 0).sort((a, b) => (a.b.checkin || "").localeCompare(b.b.checkin || ""));
  const unpaid = S.expenses.filter(e => !e.paid).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const toClose = S.bookings.filter(b => b.status === "confirmee" && isDate(b.checkout) && b.checkout <= today);
  const requests = S.bookings.filter(b => b.status === "demande" && isDate(b.checkout) && b.checkout >= today);
  const missing = [];
  const cm = ymOf(today);
  if (cm >= startMonth()) {
    const m = monthData(cm);
    if (m.rent.kind !== "real") missing.push({ k: "loyer", txt: `Loyer de ${monthName(cm)} non saisi`, sub: `${mad(S.settings.rent)} prévus` });
    if (m.wifi.kind !== "real") missing.push({ k: "wifi", txt: `Wi-Fi de ${monthName(cm)} non saisi`, sub: `${mad(S.settings.wifi)} prévus` });
    if (m.elec.kind !== "real") missing.push({ k: "electricite", txt: `Électricité et chauffage de ${monthName(cm)} à saisir`, sub: `estimation ${mad(S.settings.elecLow)} à ${mad(S.settings.elecBudget)} en attendant` });
  }
  return { lateTasks, soonTasks, payments, unpaid, toClose, requests, missing, msgs: messageTodo() };
}

function yearChartCard(year, compact) {
  const months = [];
  for (let i = 1; i <= 12; i++) months.push(monthData(`${year}-${pad(i)}`));
  const st = startMonth();
  const vis = months.map(m => (m.ym < st && !m.hasData) ? null : m);
  const max = Math.max(1, ...vis.filter(Boolean).flatMap(m => [m.net, m.costs]));
  const step = niceStep(max / 3), top = Math.ceil(max / step) * step;
  const W = 640, H = compact ? 200 : 230, L = 46, R = 8, T = 10, B = 26;
  const pw = W - L - R, ph = H - T - B, gw = pw / 12, bw = Math.min(16, gw * 0.34);
  const y = v => T + ph - (v / top) * ph;
  let g = "";
  for (let v = 0; v <= top + 0.1; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? nf0.format(v / 1000) + " k" : nf0.format(v)}</text>`;
  let bars = "", hits = "", labels = "";
  const cur = ymOf(todayStr());
  vis.forEach((m, i) => {
    const cx = L + gw * i + gw / 2, ym = `${year}-${pad(i + 1)}`;
    labels += `<text x="${cx}" y="${H - 8}" text-anchor="middle" class="${ym === S.ui.month ? "selm" : ""}">${MONTHS_SHORT[i].replace(".", "")}</text>`;
    if (m) {
      const fut = ym > cur ? "fut" : "";
      bars += topRounded(cx - bw - 1, y(m.net), bw, T + ph, `ba ${fut}`) + topRounded(cx + 1, y(m.costs), bw, T + ph, `bb ${fut}`);
    }
    hits += `<rect class="hit ${ym === S.ui.month ? "on" : ""}" x="${L + gw * i}" y="${T}" width="${gw}" height="${ph}" data-ym="${ym}" data-act="pick-month" data-i="${i}"><title>${cap(monthLabel(ym))}</title></rect>`;
  });
  const tbl = `<line class="base" x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}"/>`;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus nets et charges par mois, ${year}">${g}${hits}${bars}${tbl}${labels}</svg>`;
  const data = vis.map((m, i) => m ? { l: cap(monthLabel(`${year}-${pad(i + 1)}`)), n: m.net, c: m.costs, p: m.profit, o: m.occ, f: `${year}-${pad(i + 1)}` > cur } : null);
  return `${compact ? `<div class="card-head"><h3>Vue annuelle ${year}</h3><button class="linkbtn small" data-act="go" data-v="bilan">Détail</button></div>` : ""}

    }

    ["Plus tard", list.filter(t => !isDate(t.date) || t.date > in7)]
  ] : [["", list]];
  const chip = (k, l) => `<button class="chip" data-act="tk-filter" data-v="${k}" aria-pressed="${f === k}">${l}</button>`;
  const body = groups.filter(g => g[1].length).map(([title, items]) => `${title ? `<div class="eyebrow" style="margin:12px 0 2px">${title} · ${items.length}</div>` : ""}${items.map(taskRow).join("")}`).join("");
  return `<div class="card-head"><h3>Tâches</h3><div class="chips">${chip("open", "À traiter")}${chip("done", "Terminées")}${chip("all", "Toutes")}</div></div>
    ${body || `<div class="empty">Aucune tâche ici. <button class="linkbtn" data-act="new-task">Ajouter une tâche</button></div>`}`;
}

/* =========================================================
   Vue : résultats (calcul transparent, historique)

function monthLines(m) {
  const s = S.settings, rev = [], cost = [], info = [];
  rev.push({ label: `Nuitées (${plural(m.nights, "nuit")})`, amount: m.nightsRev, note: "Prix par nuit × nombre de nuits, réparti selon les nuits passées dans ce mois." });
  if (m.extrasIn > 0.005) rev.push({ label: "Ménage et linge facturés aux voyageurs", amount: m.extrasIn, note: "Inclus dans les versements reçus. Comptés une seule fois, ici." });
  rev.push({ label: "Revenu brut", amount: m.gross, total: true });
  const fk = kindOfFees(m);
  const parts = [];
  if (m.feeReal > 0.005) parts.push(`réels (relevé) ${mad(m.feeReal, { dec: true })}`);
  if (m.feeDerived > 0.005) parts.push(`déduits des versements réels ${mad(m.feeDerived, { dec: true })}`);
  if (m.feeEst > 0.005) parts.push(`estimés au taux des Réglages ${mad(m.feeEst, { dec: true })}`);
  rev.push({ label: "Frais Airbnb et autres plateformes", amount: -m.fee, kind: fk === "none" ? "" : fk, note: parts.join(" · ") || "Aucun frais ce mois." });
  if (Math.abs(m.adjust) >= 0.01) rev.push({ label: "Écart sur les versements réels", amount: m.adjust, kind: "real", note: "Versement reçu − (revenu brut − frais réels) : taxe retenue, remboursement, ajustement…" });
  if (m.cancelIncome > 0.005) rev.push({ label: "Indemnités d'annulation reçues", amount: m.cancelIncome, kind: "real" });
  rev.push({ label: "Revenus nets", amount: m.net, total: true, kind: m.netEst > 0.005 ? (m.netReal > 0.005 ? "mixed" : "est") : (m.net ? "real" : ""), note: m.netEst > 0.005 ? `dont ${mad(m.netEst, { dec: true })} estimés (versement réel pas encore saisi)` : "" });
  if (m.extrasDirect > 0.005) info.push(`Ménage et linge payés directement au prestataire : ${mad(m.extrasDirect, { dec: true })}. Non comptés (ni revenu, ni dépense).`);
  const fixedNote = (l, what, planned) => l.kind === "real" ? "Montant saisi dans les dépenses." : l.kind === "none" ? (m.inScope ? "Aucun montant." : "Avant le début du suivi.") : `${what} prévu dans les Réglages (${mad(planned)}), aucune dépense saisie ce mois.`;
  cost.push({ label: "Loyer", amount: m.rent.amount, kind: m.rent.kind, note: fixedNote(m.rent, "Loyer", s.rent) });
  cost.push({ label: "Wi-Fi", amount: m.wifi.amount, kind: m.wifi.kind, note: fixedNote(m.wifi, "Wi-Fi", s.wifi) });
  cost.push({ label: "Électricité et chauffage", amount: m.elec.amount, kind: m.elec.kind, warn: m.elecOver,
    note: m.elec.kind === "real" ? (m.elecOver ? `Dépasse le budget de ${mad(s.elecBudget)} de ${mad(m.elec.amount - s.elecBudget, { dec: true })}.` : `Dans le budget de ${mad(s.elecBudget)}.`) : m.elec.kind === "est" ? `Budget prudent de ${mad(s.elecBudget)} (habituellement ${mad(s.elecLow)} à ${mad(s.elecBudget)}) en attendant le montant réel.` : "" });
  cost.push({ label: "Autres charges partagées de la maison (votre part)", amount: m.shared.amount, kind: m.shared.kind,
    note: m.shared.kind === "real" ? "Montant saisi dans les dépenses." : m.shared.kind === "planned" ? `${mad(s.sharedTotal)} pour la maison ÷ ${s.sharedUnits} appartements.` : (num(s.sharedTotal) ? "" : "Montant à renseigner dans Réglages, ou à saisir en dépense.") });
  cost.push({ label: "Conciergerie", amount: m.concierge.amount, kind: m.concierge.kind,
    note: m.concierge.kind === "real" ? "Facture saisie dans les dépenses (remplace le calcul)." : `${rateFmt(s.conciergeRate)} ${{ nights: "des revenus des nuitées", nights_extras: "des nuitées + ménage/linge", payout: "des versements nets" }[s.conciergeBase]}, selon chaque réservation.` });
  for (const o of m.others) if (o.count) cost.push({ label: CAT[o.k].label, amount: o.amount, kind: "real", note: plural(o.count, "dépense saisie", "dépenses saisies") });
  if (!m.others.some(o => o.count)) cost.push({ label: "Autres dépenses réelles", amount: 0, note: "Aucune dépense d'entretien, d'équipement, de ménage, de fournitures ou autre ce mois." });
  cost.push({ label: "Total des charges", amount: m.costs, total: true });
  return { rev, cost, info };
}
function viewResults() {
  if (isLoading()) return loadingHTML();
  const ym = S.ui.month, m = monthData(ym), year = +ym.slice(0, 4);
  const L = monthLines(m);
  const tr = l => `<tr class="${l.total ? "total" : ""}"><td>${l.label} ${l.kind ? kindTag(l.kind) : ""}${l.warn ? ` <span class="pill bad">${icon("alert")}budget dépassé</span>` : ""}${l.note ? `<span class="note">${l.note}</span>` : ""}</td><td class="n">${mad(l.amount, { dec: true })}</td><td class="n muted hide-sm">${chf(l.amount)}</td></tr>`;
  const npn = netPerNight();
  const cover = m.costs > 0 ? m.net / m.costs : 0;
  const calc = `<section class="card">
    <div class="card-head"><h3>Calcul détaillé · ${monthLabel(ym)}${m.future ? ` <span class="pill blue">prévision</span>` : ""}</h3>
      <div class="vact"><button class="btn small ghost" data-act="pdf-month">${icon("download")}Résumé PDF</button></div></div>
    <div class="scroll" id="sc-calc"><table class="calc">
      <tbody>
      <tr class="section"><td colspan="3">Revenus</td></tr>
      ${L.rev.map(tr).join("")}
      <tr class="section"><td colspan="3">Charges</td></tr>
      ${L.cost.map(tr).join("")}
      <tr class="grand"><td>Bénéfice net estimé</td><td class="n ${m.profit < 0 ? "neg" : ""}">${mad(m.profit, { sign: true, dec: true })}</td><td class="n hide-sm">${chf(m.profit, { sign: true })}</td></tr>
      </tbody></table></div>
    ${L.info.map(t => `<p class="small muted" style="margin:10px 0 0">${t}</p>`).join("")}
    <div class="cols" style="margin-top:14px;gap:12px">
      <div class="kpi"><span class="lab">Seuil de rentabilité</span><span class="val">${m.costs > 0 ? pctFmt(cover) : "—"}</span><span class="sub">des charges couvertes par les revenus nets</span></div>
      <div class="kpi"><span class="lab">Reste à couvrir</span><span class="val ${m.remaining > 0 ? "neg" : "pos"}">${m.remaining > 0 ? mad(m.remaining) : "0 MAD"}</span><span class="sub">${m.remaining > 0 ? (npn > 0 ? `environ ${plural(Math.ceil(m.remaining / npn), "nuit")} de plus (≈ ${mad(npn)} nets par nuit après frais et conciergerie)` : "ajoutez des réservations pour estimer les nuits nécessaires") : "le seuil est atteint ce mois-ci"}</span></div>
    </div>
    <details class="how"><summary>Comment le calcul est fait</summary><ul>
      <li>Chaque séjour est réparti sur les mois selon ses nuits. Les demandes ne sont pas comptées ; les annulations non plus, sauf si un versement (indemnité) est saisi.</li>
      <li>Frais de plateforme : le montant réel du relevé s'il est saisi ; sinon la différence entre revenu brut et versement réel ; sinon une estimation au taux des Réglages (${rateFmt(S.settings.rates.airbnb)} pour Airbnb), appliqué aux nuitées et au ménage/linge inclus.</li>
      <li>Ménage et linge facturés : comptés en revenu seulement s'ils passent par votre versement. Ce que vous payez au prestataire se saisit en dépense « Ménage et linge payés par moi ». S'ils sont payés directement au prestataire, ils ne sont comptés nulle part.</li>
      <li>Charges fixes (loyer, Wi-Fi, électricité, charges partagées) : un montant saisi en dépense remplace le montant prévu du mois. Même règle pour une facture de conciergerie.</li>
      <li>Les dépenses en CHF ou EUR sont converties avec les taux des Réglages. Les achats d'équipement comptent en entier dans le mois de l'achat.</li>
      <li>Aucun impôt, taxe de séjour ni frais non saisi n'est inclus : le bénéfice reste une estimation basée sur vos données.</li>
    </ul></details>
  </section>`;
  // Tableau annuel
  const cur = ymOf(todayStr()), st = startMonth();
  let rows = "", tot = { n: 0, d: 0, net: 0, c: 0, p: 0 }, totAll = { net: 0, c: 0, p: 0 };
  for (let i = 1; i <= 12; i++) {
    const k = `${year}-${pad(i)}`, md = monthData(k);
    const skip = k < st && !md.hasData;
    if (!skip) {
      totAll.net += md.net; totAll.c += md.costs; totAll.p += md.profit;
      if (k <= cur) { tot.n += md.nights; tot.d += md.days; tot.net += md.net; tot.c += md.costs; tot.p += md.profit; }
    }
    rows += `<tr class="click ${k === ym ? "sel" : ""} ${k > cur ? "future" : ""}" data-act="pick-month" data-ym="${k}"><td>${cap(MONTHS[i - 1])}${k > cur ? ` <span class="kind planned">prévision</span>` : ""}</td>${skip ? `<td class="n muted" colspan="6">avant le début du suivi</td>` : `<td class="n">${md.nights}</td><td class="n">${pctFmt(md.occ)}</td><td class="n">${mad(md.net)}</td><td class="n">${mad(md.costs)}</td><td class="n ${md.profit < 0 ? "neg" : "pos"}"><b>${mad(md.profit, { sign: true })}</b></td><td class="n muted">${chf(md.profit, { sign: true })}</td>`}</tr>`;
  }
  const yearsSet = new Set([+st.slice(0, 4), +cur.slice(0, 4)]);
  S.bookings.forEach(b => { if (isDate(b.checkin)) yearsSet.add(+b.checkin.slice(0, 4)); });
  S.expenses.forEach(e => { if (isDate(e.date)) yearsSet.add(+e.date.slice(0, 4)); });
  const years = [...yearsSet].sort();
  const yrRows = years.map(yy => { const d = yearData(yy, `${yy}-12`); return `<tr class="click ${yy === year ? "sel" : ""}" data-act="pick-year" data-y="${yy}"><td><b>${yy}</b>${`${yy}-12` > cur ? ` <span class="kind planned">avec prévisions</span>` : ""}</td><td class="n">${d.nights}</td><td class="n">${pctFmt(d.occ)}</td><td class="n">${mad(d.net)}</td><td class="n">${mad(d.costs)}</td><td class="n ${d.profit < 0 ? "neg" : "pos"}"><b>${mad(d.profit, { sign: true })}</b></td></tr>`; }).join("");
  const annual = `<section class="card">
    <div class="card-head"><h3>Historique ${year}</h3><div class="msw"><button class="icon-btn" data-act="year" data-d="-1" aria-label="Année précédente">${icon("left")}</button><span class="mlabel" style="min-width:4em">${year}</span><button class="icon-btn" data-act="year" data-d="1" aria-label="Année suivante">${icon("right")}</button></div></div>
    ${yearChartCard(year, false)}
    <div class="scroll" id="sc-year" style="margin-top:12px"><table>
      <thead><tr><th>Mois</th><th class="n">Nuits</th><th class="n">Occup.</th><th class="n">Revenus nets</th><th class="n">Charges</th><th class="n">Bénéfice</th><th class="n">≈ CHF</th></tr></thead>
      <tbody>${rows}
      <tr class="total"><td>Cumul à ce jour</td><td class="n">${tot.n}</td><td class="n">${tot.d ? pctFmt(tot.n / tot.d) : "—"}</td><td class="n">${mad(tot.net)}</td><td class="n">${mad(tot.c)}</td><td class="n ${tot.p < 0 ? "neg" : "pos"}">${mad(tot.p, { sign: true })}</td><td class="n">${chf(tot.p, { sign: true })}</td></tr>
      ${Math.abs(totAll.p - tot.p) > 0.5 ? `<tr class="sub"><td>Avec les mois à venir</td><td></td><td></td><td class="n">${mad(totAll.net)}</td><td class="n">${mad(totAll.c)}</td><td class="n">${mad(totAll.p, { sign: true })}</td><td class="n">${chf(totAll.p, { sign: true })}</td></tr>` : ""}
      </tbody></table></div>
  </section>`;
  const byYear = `<section class="card"><div class="card-head"><h3>Par année</h3></div><div class="scroll" id="sc-years"><table><thead><tr><th>Année</th><th class="n">Nuits</th><th class="n">Occup.</th><th class="n">Revenus nets</th><th class="n">Charges</th><th class="n">Bénéfice</th></tr></thead><tbody>${yrRows}</tbody></table></div></section>`;
  const exp = `<section class="card"><div class="card-head"><h3>Exporter</h3></div>
    <div class="vact"><button class="btn small" data-act="xlsx">${icon("download")}Classeur Excel complet</button><button class="btn small ghost" data-act="csv" data-t="monthly">Résultats mensuels (CSV)</button><button class="btn small ghost" data-act="csv" data-t="bookings">Réservations (CSV)</button><button class="btn small ghost" data-act="csv" data-t="expenses">Dépenses (CSV)</button><button class="btn small ghost" data-act="pdf-month">Résumé PDF de ${monthName(ym)}</button></div>
    <p class="xs muted" style="margin:0">Le classeur Excel contient les résultats mensuels, les réservations, les dépenses, les tâches et les paramètres. Les CSV utilisent le point-virgule (format Excel en français).</p></section>`;
  return viewHead("Résultats") + `<div class="stack">${calc}${annual}<div class="cols">${byYear}${exp}</div></div>`;
}

async function saveSetting(el) {
  const key = el.dataset.set;
  const next = JSON.parse(JSON.stringify(S.settings));
  if (!isYm(next.startMonth)) next.startMonth = startMonth();
  if (key === "conciergeBase") next.conciergeBase = el.value;
  else if (key === "startMonth") {
    if (!isYm(el.value)) { toast("Format attendu : AAAA-MM, par exemple 2026-09."); el.value = next.startMonth; return; }
    next.startMonth = el.value;
  } else {
    const v = parseOpt(el.value);
    if (v === null || isNaN(v) || v < 0) { toast("Saisissez un nombre positif (la virgule est acceptée)."); el.value = inVal(key.startsWith("rate-") ? S.settings.rates[key.slice(5)] : S.settings[key]); return; }
    if ((key === "madPerChf" || key === "madPerEur" || key === "sharedUnits") && v === 0) { toast("Cette valeur doit être supérieure à zéro."); el.value = inVal(S.settings[key]); return; }
    if (key.startsWith("rate-")) next.rates[key.slice(5)] = v; else next[key] = v;
  }
  try { await putSettings(next); toast("Réglage enregistré."); } catch (e) {}
}

function readBookingForm(orig) {
  const v = id => $("#" + id).value;
  const radio = n => ($(`input[name="${n}"]:checked`) || {}).value;
  const nums = {};
  for (const [k, id] of [["price", "bf-price"], ["cleaning", "bf-cleaning"], ["linen", "bf-linen"], ["feeReal", "bf-feeReal"], ["payout", "bf-payout"], ["guestTotal", "bf-guestTotal"], ["received", "bf-received"], ["conciergeManual", "bf-cManual"], ["guests", "bf-guests"]]) {
    const n = parseOpt(v(id));
    if (Number.isNaN(n) || (n !== null && n < 0)) return { error: `Montant invalide : vérifiez le champ « ${$(`label[for="${id}"]`)?.textContent || $("#" + id).getAttribute("aria-label") || id} ».` };
    nums[k] = n;
  }
  const data = { ...orig, guest: v("bf-guest").trim(), platform: v("bf-platform"), checkin: v("bf-checkin"), checkout: v("bf-checkout"), status: v("bf-status"), payStatus: v("bf-pay"),
    extrasMode: radio("bf-extras") || "payout", feeMode: radio("bf-fee") || "auto", conciergeMode: radio("bf-conc") || "auto", notes: v("bf-notes").trim(), ...nums };
  if (data.guests !== null) data.guests = Math.round(data.guests);
  if (data.payStatus !== "partiel") data.received = null;
  return { data, makeTasks: !!($("#bf-tasks") && $("#bf-tasks").checked), error: !data.guest ? "Indiquez le nom ou la référence du voyageur." : (!isDate(data.checkin) || !isDate(data.checkout)) ? "Indiquez les dates d'arrivée et de départ." : data.checkout <= data.checkin ? "La date de départ doit être après la date d'arrivée." : null };
}
function updateBookingPreview(orig) {

  $("#bf-received-wrap").hidden = b.payStatus !== "partiel";
  $("#bf-nights").innerHTML = c.nights ? `<b>${plural(c.nights, "nuit")}</b> · ${mad(c.nightsRev, { dec: true })} de nuitées` : "Choisissez les dates";
  const feeSub = $("#bf-fee-auto-sub");
  if (feeSub) feeSub.textContent = c.rate ? `${rateFmt(c.rate)} (${PLATFORMS[b.platform]}) de ${mad(c.gross, { dec: true })} = ${mad(c.feeEst, { dec: true })}${c.hasPayout && b.feeMode === "auto" ? `. Comme le versement réel est saisi, les frais retenus sont la différence : ${mad(c.fee, { dec: true })}.` : ""}` : `Taux de ${PLATFORMS[b.platform]} : 0 % (modifiable dans Réglages).`;
  const cSub = $("#bf-conc-auto-sub");
  if (cSub) cSub.textContent = `${rateFmt(c.cRate)} de ${mad(c.cBase, { dec: true })} (${{ nights: "nuitées", nights_extras: "nuitées + ménage/linge", payout: "versement net" }[s.conciergeBase]}) = ${mad(c.cAuto, { dec: true })}`;
  const w = [];
  if (b.guests && b.guests > num(s.capacity)) w.push(`Capacité maximale : ${plural(num(s.capacity), "voyageur")}.`);
  if (isDate(b.checkin) && isDate(b.checkout) && b.checkout > b.checkin && b.status !== "annulee") {
    const ov = overlaps(b);
    if (ov.length) w.push(`Chevauche ${ov.map(o => `« ${esc(o.guest)} » (${fmtRange(o.checkin, o.checkout)})`).join(", ")}.`);
  }
  if (isDate(b.checkin) && isDate(b.checkout) && b.checkout <= b.checkin) w.push("La date de départ doit être après la date d'arrivée.");
  if (b.feeMode === "real" && !isNum(b.feeReal)) w.push("Saisissez le montant réel des frais, sinon l'estimation est utilisée.");

  const feeLbl = { est: `estimé ${rateFmt(c.rate)}`, real: "réel (relevé)", derived: "déduit du versement", off: "désactivé" }[c.feeKind];
  const L = (a, v, cls = "") => `<div class="cl ${cls}"><span>${a}</span><span>${v}</span></div>`;
  $("#bf-summary").innerHTML = L(`Nuitées (${c.nights} × ${mad(c.price, { dec: true })})`, mad(c.nightsRev, { dec: true }))
    + (c.extrasIn ? L("+ Ménage et linge (inclus)", mad(c.extrasIn, { dec: true })) : "")
    + L("= Revenu brut", mad(c.gross, { dec: true }), "tot")
    + L(`− Frais plateforme (${feeLbl})`, mad(-c.fee, { dec: true }))
    + (Math.abs(c.adjust) >= 0.01 ? L("± Écart avec le versement réel", mad(c.adjust, { dec: true, sign: true })) : "")
    + L(c.hasPayout ? "= Versement réel reçu" : "= Net estimé (versement inconnu)", mad(c.net, { dec: true }), "tot")
    + L(`− Conciergerie${c.cKind === "auto" ? ` (${rateFmt(c.cRate)})` : c.cKind === "off" ? " (aucune)" : ""}`, mad(-c.concierge, { dec: true }))
    + L("= Contribution du séjour", `${mad(c.net - c.concierge, { dec: true })} · ≈ ${chf(c.net - c.concierge)}`, "tot")
    + (c.extrasDirect ? `<div class="xs muted" style="margin-top:6px">Ménage et linge payés directement au prestataire (${mad(c.extrasDirect, { dec: true })}) : non comptés.</div>` : "")

const MIME = { json: "application/json", csv: "text/csv", pdf: "application/pdf", xlsx: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" };
async function saveStandalone(filename, data) {
  const type = MIME[filename.split(".").pop()] || "application/octet-stream";
  let file = null; try { file = new File([data], filename, { type }); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.share) {
    let ok = false; try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
    if (ok) {
      try { await navigator.share({ files: [file] }); toast(`Fichier prêt : ${filename}`); return true; }
      catch (e) { if (e && e.name === "AbortError") { toast("Partage annulé."); return false; } }
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); toast(`Fichier téléchargé : ${filename}`); return true;
  } catch (e) {
    if (typeof data === "string") showCopyFallback(filename, data); else toast("Impossible d'enregistrer ce fichier sur cet appareil.");
    return false;
  }
}
async function saveFile(filename, data) {
  if (STANDALONE) return saveStandalone(filename, data);
  const dl = await getDownloads();
  if (!dl) { if (typeof data === "string") showCopyFallback(filename, data); else toast("Le téléchargement n'est pas disponible dans cette vue. Utilisez l'export CSV."); return false; }
  try { await dl.save({ filename, data }); toast(`Fichier prêt : ${filename}`); return true; }
  catch (e) {
    const code = e && e.code;
    if (code === "declined") toast("Téléchargement annulé.");
    else if (code === "rate_limited") toast("Une demande de téléchargement est déjà ouverte. Réessayez dans un instant.");
    else if (typeof data === "string") showCopyFallback(filename, data);
    else toast("Téléchargement impossible dans cette vue. Utilisez l'export CSV.");
    return false;
  }
}

const scriptCache = {};
function loadScript(src, globalName) {

    document.head.appendChild(el);

  return scriptCache[src];
}

      let x = M;
      cells.forEach((c, i) => { doc.setFont("helvetica", o.bold ? "bold" : "normal"); doc.setFontSize(o.size || 8.5); doc.setTextColor(...(o.color || ink)); const al = aligns[i] === "r"; doc.text(lines[i], al ? x + widths[i] - 1 : x + 1, y + 3.9, al ? { align: "right" } : undefined); x += widths[i]; });
      y += h; doc.setDrawColor(...line); doc.setLineWidth(0.2); doc.line(M, y, M + CW, y);
    };
    drawRow(head, { bold: true, size: 7.5, color: muted });
    rows.forEach(r => drawRow(r.cells || r, r.o || {}));
    y += 6;
  };
  const kl = k => kindLabel(k);
  table("Calcul détaillé", ["Poste", "Nature", "MAD", "CHF"],
    [{ cells: ["REVENUS", "", "", ""], o: { bold: true, size: 7.5, color: muted, fill: [246, 238, 238] } },
     ...L.rev.map(l => ({ cells: [l.label + (l.note ? `\n${l.note}` : ""), kl(l.kind), mad(l.amount, { dec: true }), chf(l.amount)], o: l.total ? { bold: true } : {} })),
     { cells: ["CHARGES", "", "", ""], o: { bold: true, size: 7.5, color: muted, fill: [246, 238, 238] } },
     ...L.cost.map(l => ({ cells: [l.label + (l.note ? `\n${l.note}` : ""), kl(l.kind), mad(l.amount, { dec: true }), chf(l.amount)], o: l.total ? { bold: true } : {} })),
     { cells: ["Bénéfice net estimé", "estimation", mad(m.profit, { sign: true, dec: true }), chf(m.profit, { sign: true })], o: { bold: true, fill: [238, 221, 225], size: 9.5 } }],
    [CW - 78, 26, 28, 24], ["l", "l", "r", "r"]);
  if (L.info.length) { L.info.forEach(t => { ensure(6); T(t, M, y - 3, { size: 8, color: muted }); y += 4; }); y += 3; }
  const bk = m.items.map(({ b, c, n }) => [b.guest + (b.sample ? " (exemple)" : ""), fmtRange(b.checkin, b.checkout), String(n || 0), PLATFORMS[b.platform] || "", BSTATUS[b.status] || "", PSTATUS[b.payStatus] || "", `${mad(c.net, { dec: true })} ${c.netKind === "real" ? "(réel)" : "(estimé)"}`]);
  if (bk.length) table("Réservations du mois", ["Voyageur", "Dates", "Nuits", "Plateforme", "Statut", "Paiement", "Net du séjour"], bk, [40, 34, 11, 22, 21, 23, CW - 151], ["l", "l", "r", "l", "l", "l", "r"]);
  const ex = S.expenses.filter(e => isDate(e.date) && ymOf(e.date) === ym).sort((a, b) => a.date.localeCompare(b.date)).map(e => [fmtDate(e.date, { day: "2-digit", month: "2-digit" }), CAT[e.category]?.label || "Autres", e.description || "", e.currency && e.currency !== "MAD" ? `${nfr(num(e.amount), true)} ${e.currency}` : "", mad(toMAD(e), { dec: true }), e.paid ? "payée" : "à payer"]);
  if (ex.length) table("Dépenses saisies", ["Date", "Catégorie", "Description", "Devise", "MAD", "Statut"], ex, [14, 40, CW - 120, 22, 26, 18], ["l", "l", "l", "r", "r", "l"]);
  const tk = S.tasks.filter(t => t.status !== "terminee" && isDate(t.date) && t.date <= ymAdd(ym, 1) + "-07").sort((a, b) => a.date.localeCompare(b.date)).slice(0, 15).map(t => [fmtDate(t.date, { day: "2-digit", month: "2-digit" }), t.title, TSTATUS[t.status] || "", t.date < todayStr() ? "en retard" : ""]);
  if (tk.length) table("Tâches à traiter", ["Date", "Tâche", "Statut", ""], tk, [16, CW - 56, 22, 18], ["l", "l", "l", "l"]);
  ensure(12);
  T("Estimation basée uniquement sur les données saisies. Aucun impôt, taxe ni frais non saisi n'est inclus.", M, y, { size: 7.5, color: muted });
  if (hasSample()) { y += 4; T("Ce document contient des données d'exemple fictives.", M, y, { size: 7.5, color: [90, 18, 38] }); }
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); T(`Appartement Diabat · ${cap(monthLabel(ym))} · page ${i}/${pages}`, W / 2, 292, { size: 7, color: muted, align: "center" }); }
  saveFile(`appartement-diabat-resume-${ym}.pdf`, new Uint8Array(doc.output("arraybuffer")));
}

/* =========================================================
   Import d'une sauvegarde
   ========================================================= */
function sanitizeList(arr, prefix) {
  if (!Array.isArray(arr)) return [];
  return arr.filter(x => x && typeof x === "object").map(x => { const o = JSON.parse(JSON.stringify(x)); if (!validId(o.id)) o.id = uid(prefix); return o; });
}
function handleImport(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(String(r.result)); } catch (e) { toast("Ce fichier n'est pas une sauvegarde lisible (.json attendu)."); return; }
    if (!d || typeof d !== "object" || (!Array.isArray(d.bookings) && !Array.isArray(d.expenses) && !Array.isArray(d.tasks))) { toast("Ce fichier ne ressemble pas à une sauvegarde de l'application."); return; }
    const data = { settings: d.settings && typeof d.settings === "object" ? d.settings : null, bookings: sanitizeList(d.bookings, "b"), expenses: sanitizeList(d.expenses, "e"), tasks: sanitizeList(d.tasks, "t"), messages: Array.isArray(d.messages) ? sanitizeList(d.messages, "m") : null };
    confirmDialog({
      title: "Réimporter une sauvegarde",
      body: `<p style="margin:0">Le fichier contient <b>${plural(data.bookings.length, "réservation")}</b>, <b>${plural(data.expenses.length, "dépense")}</b> et <b>${plural(data.tasks.length, "tâche")}</b>${data.messages && data.messages.length ? `, plus ${plural(data.messages.length, "modèle de message", "modèles de messages")}` : ""}${d.exportedAt ? `, exportés le ${fmtDate(String(d.exportedAt).slice(0, 10), { day: "numeric", month: "long", year: "numeric" })}` : ""}.</p>`,
      extra: `<label class="opt"><input type="checkbox" id="im-replace" checked><span><b>Remplacer les données actuelles</b><small>Décochez pour ajouter le contenu du fichier à vos données (les éléments identiques sont mis à jour).</small></span></label>
        ${data.settings ? `<label class="opt"><input type="checkbox" id="im-settings" checked><span><b>Restaurer aussi les réglages</b><small>Loyer, taux, budget, taux de change…</small></span></label>` : ""}`,
      confirm: "Importer",
      onConfirm: async vals => {
        try {
          toast("Import en cours…");
          if (vals["im-replace"]) {
            const ids = { bookings: new Set(data.bookings.map(x => x.id)), expenses: new Set(data.expenses.map(x => x.id)), tasks: new Set(data.tasks.map(x => x.id)) };
            for (const c of ["tasks", "expenses", "bookings"]) for (const x of S[c].slice()) if (!ids[c].has(x.id)) await delDoc(c, x.id);
          }
          for (const c of ["bookings", "expenses", "tasks"]) for (const x of data[c]) await putDoc(c, x);
          if (data.messages) {
            if (vals["im-replace"]) { const keep = new Set(data.messages.map(x => x.id)); for (const x of S.messages.slice()) if (!keep.has(x.id)) await delDoc("messages", x.id); }
            for (const x of data.messages) await putDoc("messages", x);
          }
          if (vals["im-settings"] && data.settings) await putSettings(mergeSettings(data.settings));
          toast("Sauvegarde importée.");
        } catch (e) {}
      }
    });
  };
  r.onerror = () => toast("Lecture du fichier impossible.");
  r.readAsText(file);
}

/* =========================================================
   Événements
   ========================================================= */
function go(v) {
  if (!VIEWS[v]) v = "accueil";
  S.ui.view = v;
  try { if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); } catch (e) { location.hash = v; }
  render(); window.scrollTo({ top: 0 });
}
const find = (c, id) => S[c].find(x => x.id === id);
const CYCLE = { afaire: "encours", encours: "terminee", terminee: "afaire" };
async function onAction(el) {
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case "go": closeModal(); go(el.dataset.v); break;
    case "go-upcoming": S.ui.f.bkPeriod = "upcoming"; go("sejours"); break;
    case "month": S.ui.month = ymAdd(S.ui.month, +el.dataset.d); S.ui.selDay = null; render(); break;
    case "month-today": S.ui.month = ymOf(todayStr()); S.ui.selDay = null; render(); break;
    case "year": S.ui.month = ymAdd(S.ui.month, 12 * +el.dataset.d); render(); break;
    case "pick-month": S.ui.month = el.dataset.ym; S.ui.selDay = null; render(); break;
    case "pick-year": S.ui.month = `${el.dataset.y}-${S.ui.month.slice(5)}`; render(); break;
    case "sel-day": S.ui.selDay = el.dataset.d; renderView(); break;
    case "tk-filter": S.ui.f.tk = el.dataset.v; renderView(); break;
    case "new-booking": bookingForm(null); break;
    case "edit-booking": { const b = find("bookings", id); if (b) bookingForm(b); break; }
    case "new-expense": expenseForm(null, { category: el.dataset.cat }); break;
    case "edit-expense": { const e = find("expenses", id); if (e) expenseForm(e); break; }
    case "new-task": taskForm(null, { date: el.dataset.date }); break;
    case "edit-task": { const t = find("tasks", id); if (t) taskForm(t); break; }
    case "close-modal": closeModal(); break;
    case "prep-msg": S.ui.msg.bookingId = id; S.ui.msg.name = null; if (el.dataset.k) S.ui.msg.key = el.dataset.k; closeModal(); go("messages"); scrollToPreview(); break;
    case "msg-tpl": S.ui.msg.key = el.dataset.k; renderView(); scrollToPreview(); break;
    case "msg-lang": S.ui.msg.lang = el.dataset.v; renderView(); break;
    case "msg-goinfo": { const c = $("#msg-info"); if (c) { const f = el.dataset.k ? $("#mi-" + el.dataset.k) : $("#msg-info input"); (f || c).scrollIntoView({ behavior: "smooth", block: "center" }); if (f) setTimeout(() => f.focus({ preventScroll: true }), 350); } break; }
    case "msg-copy": {
      const m = currentMessage();
      try { await navigator.clipboard.writeText(m.plain); toast(m.missing.length ? "Message copié. Pensez à compléter les informations entre crochets." : "Message copié : collez-le dans la messagerie."); }
      catch (e) { showCopyFallback("message.txt", m.plain, "La copie automatique n'est pas possible ici. Sélectionnez le texte ci-dessous, puis copiez-le."); }
      break;
    }
    case "msg-share": { const m = currentMessage(); try { await navigator.share({ text: m.plain }); } catch (e) {} break; }
    case "msg-sent": {
      const m = currentMessage(); if (!m.b) break;
      const sent = { ...(m.b.sent || {}) };
      if (sent[m.t.key]) delete sent[m.t.key]; else sent[m.t.key] = todayStr();
      try { await putDoc("bookings", { ...m.b, sent }); toast(sent[m.t.key] ? "Marqué comme envoyé." : "Marque d'envoi retirée."); } catch (e) {}
      break;
    }
    case "msg-edit": msgForm(currentMessage().t); break;
    case "msg-new": msgForm(null); break;
    case "msg-ph": { const ta = lastMsgTa && document.body.contains(lastMsgTa) ? lastMsgTa : $("#mf-fr"); if (ta) { ta.focus(); ta.setRangeText(`{${el.dataset.k}}`, ta.selectionStart, ta.selectionEnd, "end"); } break; }
    case "msg-reset": { const k = el.dataset.k; confirmDialog({ title: "Rétablir le texte d'origine ?", body: `<p style="margin:0">Vos modifications de ce modèle seront remplacées par le texte proposé au départ, dans les trois langues.</p>`, confirm: "Rétablir", onConfirm: async () => { try { await delDoc("messages", k); toast("Texte d'origine rétabli."); } catch (e) {} } }); break; }
    case "msg-del": { const k = el.dataset.k; confirmDialog({ title: "Supprimer ce modèle ?", body: `<p style="margin:0">Le modèle sera supprimé dans les trois langues.</p>`, danger: true, confirm: "Supprimer", onConfirm: async () => { try { await delDoc("messages", k); S.ui.msg.key = "arrivee"; toast("Modèle supprimé."); } catch (e) {} } }); break; }
    case "tk-template": { const i = $("#tf-title"); if (i) { i.value = el.dataset.v; i.focus(); } break; }
    case "del-booking": {
      const b = find("bookings", id); if (!b) break;
      const linked = S.tasks.filter(t => t.bookingId === id);
      confirmDialog({ title: "Supprimer la réservation ?", body: `<p style="margin:0">« ${esc(b.guest)} » (${fmtRange(b.checkin, b.checkout)}) sera supprimée définitivement.</p>`, danger: true, confirm: "Supprimer",
        extra: linked.length ? `<label class="opt"><input type="checkbox" id="db-tasks" checked><span><b>Supprimer aussi ${plural(linked.length, "tâche liée", "tâches liées")}</b></span></label>` : "",
        onConfirm: async v => { try { if (v["db-tasks"]) for (const t of linked) await delDoc("tasks", t.id); await delDoc("bookings", id); toast("Réservation supprimée."); } catch (e) {} } });
      break;
    }
    case "del-expense": { const e = find("expenses", id); if (!e) break; confirmDialog({ title: "Supprimer la dépense ?", body: `<p style="margin:0">« ${esc(e.description || CAT[e.category]?.label)} » (${mad(toMAD(e), { dec: true })}) sera supprimée.</p>`, danger: true, confirm: "Supprimer", onConfirm: async () => { try { await delDoc("expenses", id); toast("Dépense supprimée."); } catch (x) {} } }); break; }
    case "del-task": { const t = find("tasks", id); if (!t) break; confirmDialog({ title: "Supprimer la tâche ?", body: `<p style="margin:0">« ${esc(t.title)} » sera supprimée.</p>`, danger: true, confirm: "Supprimer", onConfirm: async () => { try { await delDoc("tasks", id); toast("Tâche supprimée."); } catch (x) {} } }); break; }
    case "task-done": { const t = find("tasks", id); if (t) { try { await putDoc("tasks", { ...t, status: "terminee" }); toast("Tâche terminée."); } catch (e) {} } break; }
    case "task-toggle": { const t = find("tasks", id); if (t) try { await putDoc("tasks", { ...t, status: t.status === "terminee" ? "afaire" : "terminee" }); } catch (e) {} break; }
    case "task-cycle": { const t = find("tasks", id); if (t) try { await putDoc("tasks", { ...t, status: CYCLE[t.status] || "encours" }); } catch (e) {} break; }
    case "exp-paid": { const e = find("expenses", id); if (e) try { await putDoc("expenses", { ...e, paid: true }); toast("Dépense marquée comme payée."); } catch (x) {} break; }
    case "exp-toggle": { const e = find("expenses", id); if (e) try { await putDoc("expenses", { ...e, paid: !e.paid }); } catch (x) {} break; }
    case "quick-pay": { const b = find("bookings", id); if (b) quickPay(b); break; }
    case "bk-close": { const b = find("bookings", id); if (b) try { await putDoc("bookings", { ...b, status: "terminee" }); toast("Séjour marqué comme terminé."); } catch (e) {} break; }
    case "gen-fixed": generateFixed(S.ui.view === "accueil" ? ymOf(todayStr()) : S.ui.month); break;
    case "del-samples": confirmDialog({ title: "Supprimer les données d'exemple ?", body: `<p style="margin:0">Toutes les réservations, dépenses et tâches marquées « Exemple » seront supprimées. Vos propres données sont conservées.</p>`,
      extra: `<label class="opt"><input type="checkbox" id="ds-start" checked><span><b>Commencer le suivi en ${monthLabel(ymOf(todayStr()))}</b><small>Les charges prévues (loyer, Wi-Fi…) ne seront comptées qu'à partir de ce mois. Modifiable dans Réglages.</small></span></label>`,
      confirm: "Supprimer les exemples", danger: true, onConfirm: deleteSamples }); break;
    case "wipe": confirmDialog({ title: "Effacer toutes les données ?", body: `<p style="margin:0">Toutes les réservations, dépenses et tâches seront supprimées définitivement. Les réglages sont conservés.</p>`, extra: `<label class="opt"><input type="checkbox" id="wp-ok"><span><b>J'ai exporté une sauvegarde ou je n'en ai pas besoin</b></span></label>`, confirm: "Tout effacer", danger: true,
      onConfirm: async v => { if (!v["wp-ok"]) { toast("Cochez la case de confirmation pour effacer."); return; } await wipeAll(); } }); break;
    case "backup": if (await saveFile(`appartement-diabat-sauvegarde-${stamp()}.json`, JSON.stringify(backupData(), null, 2))) { try { localStorage.setItem(LS_BACKUP, todayStr()); } catch (e) {} render(); } break;
    case "import": $("#import-file").value = ""; $("#import-file").click(); break;
    case "csv": exportCSV(el.dataset.t); break;
    case "xlsx": exportXLSX(); break;
    case "pdf-month": exportPDF(S.ui.month); break;
    case "copy-area": {
      const ta = $("#copy-area");
      try { await navigator.clipboard.writeText(ta.value); toast("Copié dans le presse-papiers."); }
      catch (e) { ta.focus(); ta.select(); toast("Sélectionné : utilisez Copier (Ctrl+C ou appui long)."); }
      break;
    }
  }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.tagName === "A") e.preventDefault();
  onAction(el);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); onAction(e.target); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset && t.dataset.filter) { S.ui.f[t.dataset.filter] = t.value; renderView(); return; }
  if (t.dataset && t.dataset.msg === "name") { S.ui.msg.name = t.value; renderView(); return; }
  if (modal().contains(t) && modalInput) modalInput();
});
document.addEventListener("focusin", e => { if (e.target.classList && e.target.classList.contains("msg-ta")) lastMsgTa = e.target; });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "import-file") { handleImport(t.files && t.files[0]); return; }
  if (t.dataset && t.dataset.set) { saveSetting(t); return; }
  if (t.dataset && t.dataset.info) { saveInfo(t); return; }
  if (t.dataset && t.dataset.msg === "bookingId") { S.ui.msg.bookingId = t.value; S.ui.msg.name = null; renderView(); return; }
  if (modal().contains(t) && modalInput) modalInput();
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (modal().contains(e.target) && modalSubmit) modalSubmit();
});
modal().addEventListener("close", () => { if (modal().open) return; rescueToast(); modal().innerHTML = ""; modalSubmit = modalInput = null; });
modal().addEventListener("click", e => { if (e.target === modal()) closeModal(); });
let toastTimer = null;
function toast(msg) {
  const t = $("#toast"); const d = modal();
  if (d.open) { if (t.parentNode !== d) d.appendChild(t); t.classList.add("in-modal"); } else rescueToast();
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3600);
}
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== S.ui.view) { S.ui.view = v; render(); } });

/* =========================================================
   Démarrage
   ========================================================= */
{ const v = location.hash.slice(1); if (VIEWS[v]) S.ui.view = v; }
renderTabs(); renderSync();
if (STANDALONE && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
initStore();
getDownloads();
})();
</script>
